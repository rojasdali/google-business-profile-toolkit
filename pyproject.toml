[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-business-profile-toolkit"
version = "0.1.0"
description = "Agnostic, modular Python SDK and CLI for Google Business Profile API: local posts, zero-repeat deduplication, holiday hours, reviews, and local search performance metrics."
readme = "README.md"
authors = [{ name = "Dali Rojas", email = "rojasdali@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gbp = "gbp_toolkit.cli:main"
